#Which one-time fixes this file has been through. Leave it alone.
# Default: 1
# Range: > 1
configVersion = 6

#Malice (cursed energy). Capacity is rolled once at birth and never changes.
[malice]
	#Regen pauses for this many seconds after the player deals or takes damage.
	# Default: 5.0
	# Range: 0.0 ~ 600.0
	regenPauseSeconds = 5.0
	#A non-zero tier's capacity at birth: its base, plus or minus up to this percent of the base. Never reaches 0.
	# Default: 10.0
	# Range: 0.0 ~ 100.0
	capacityVariationPercent = 10.0

	#Birth tiers. weight = relative roll chance, base = capacity before variation,
	#regenPercentPerSecond = reserve regenerated per second, as a percent of capacity.
	[malice.tiers]

		[malice.tiers.zero]
			# Default: 2
			# Range: 0 ~ 1000000
			weight = 2

		[malice.tiers.low]
			# Default: 30
			# Range: 0 ~ 1000000
			weight = 30
			# Default: 250
			# Range: 1 ~ 1000000
			base = 250
			# Default: 3.0
			# Range: 0.0 ~ 100.0
			regenPercentPerSecond = 3.0

		[malice.tiers.average]
			# Default: 45
			# Range: 0 ~ 1000000
			weight = 45
			# Default: 600
			# Range: 1 ~ 1000000
			base = 600
			# Default: 2.0
			# Range: 0.0 ~ 100.0
			regenPercentPerSecond = 2.0

		[malice.tiers.high]
			# Default: 20
			# Range: 0 ~ 1000000
			weight = 20
			# Default: 1500
			# Range: 1 ~ 1000000
			base = 1500
			# Default: 1.5
			# Range: 0.0 ~ 100.0
			regenPercentPerSecond = 1.5

		[malice.tiers.vast]
			# Default: 3
			# Range: 0 ~ 1000000
			weight = 3
			# Default: 10000
			# Range: 1 ~ 1000000
			base = 10000
			# Default: 0.75
			# Range: 0.0 ~ 100.0
			regenPercentPerSecond = 0.75

#Traits rolled at birth. Unique traits have at most one bearer per world.
[traits]
	#Chance (0-1) to be born with six_eyes (unique, needs Malice; its numbers are in [six_eyes]).
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	sixEyesBirthChance = 0.01
	#Who inherits six_eyes when its bearer loses it (killed by a player, released, inactive).
	#RANDOM = a random eligible online player. KILLER = the killer if eligible and online, else RANDOM.
	#Eligible = online, not Severed, not the previous bearer. If nobody is eligible it waits for the next eligible login.
	#Allowed Values: RANDOM, KILLER
	sixEyesTransferMode = "RANDOM"
	#Seconds between losing six_eyes and it opening in someone else.
	# Default: 30.0
	# Range: 0.0 ~ 86400.0
	sixEyesTransferDelaySeconds = 30.0
	#Release a unique trait if its holder hasn't logged in for this many days (fractions allowed).
	#0 = disabled. Inheritable traits (six_eyes) then pass on as if their bearer had lost them.
	# Default: 0.0
	# Range: 0.0 ~ 3650.0
	uniqueTraitInactiveDays = 0.0

#Innate technique rolls (birth and rerolls).
[roll]
	#After this many rolls without a LEGENDARY, each further roll adds softPityIncrement to the LEGENDARY weight.
	# Default: 30
	# Range: 0 ~ 100000
	softPityStart = 30
	#LEGENDARY weight added per roll once soft pity is active.
	# Default: 5
	# Range: 0 ~ 1000000
	softPityIncrement = 5
	#This roll number (counting since the last LEGENDARY) is a guaranteed LEGENDARY. 0 disables hard pity.
	# Default: 50
	# Range: 0 ~ 100000
	hardPity = 50
	#Whether TEST innate techniques can be rolled. Turn off once real ones exist.
	includeTestInnateTechniques = true

	#Relative rarity weights. Rarities with no eligible innate technique are skipped.
	[roll.weights]
		# Default: 50
		# Range: 0 ~ 1000000
		common = 50
		# Default: 30
		# Range: 0 ~ 1000000
		rare = 30
		# Default: 15
		# Range: 0 ~ 1000000
		epic = 15
		# Default: 5
		# Range: 0 ~ 1000000
		legendary = 5

#Shared combat state used by abilities and future systems.
[combat]
	#A player counts as 'in combat' for this many seconds after dealing or taking damage.
	# Default: 10.0
	# Range: 0.0 ~ 600.0
	combatTagSeconds = 10.0

