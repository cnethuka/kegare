	#The framework for shared and system unlocks, separate from a technique's own abilities.
	[progression.unlocks]
		#Refinement levels matching Insight takes off an unlock's requirement, per point of Insight. It rounds down, so by default 10 Insight is 1 level.
		# Default: 0.1
		# Range: 0.0 ~ 100.0
		refinementLoweredPerInsight = 0.1
		#The most Insight can take off, as a share of the requirement, rounded down. It speeds an unlock up but never removes the requirement: 1 stays 1 even at 1.0.
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		refinementLoweredCap = 0.5

	#The shared hit path: what counts as landing an ability on a real target.
	[progression.landing]
		#Seconds before the same ability can land on the same target again: one volley or channel isn't twenty landings.
		# Default: 1.0
		# Range: 0.0 ~ 60.0
		repeat = 1.0
		#An ability with no target of its own only counts used this long after trading a hit with something real.
		#Used with nobody around, it earns nothing.
		# Default: 10.0
		# Range: 0.0 ~ 600.0
		noTargetWindow = 10.0
		#A puppet's own hits earn its owner Refinement and Grade XP only this long after the owner personally landed a hit or an ability on a real target.
		#The puppet keeps fighting either way: an idle owner just earns nothing from it.
		# Default: 30.0
		# Range: 0.0 ~ 3600.0
		ownerActiveWindow = 30.0

	#Bush Camper (an advancement): steal another person's kill.
	[progression.bush_camper]
		#Another player dealt at least this share of the damage the victim took in the window, and you (who landed the
		#killing blow) dealt the rest or less.
		# Default: 0.75
		# Range: 0.5 ~ 1.0
		stealShare = 0.75
		#The window, in seconds.
		# Default: 30.0
		# Range: 1.0 ~ 3600.0
		stealWindow = 30.0

