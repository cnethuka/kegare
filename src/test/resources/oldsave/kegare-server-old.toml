#Puppet Manipulation (EPIC innate technique): half-size puppets of yourself, charged with Malice. Times are in seconds.
[puppet_manipulation]

	#The puppets themselves.
	[puppet_manipulation.puppet]
		#Size next to their owner (the 1.21 scale attribute). Never changes, except during Stand-In.
		# Default: 0.5
		# Range: 0.1 ~ 1.0
		scale = 0.5
		#Movement speed attribute (mob scale, not a player's): 0.42 walks a little faster than a walking player.
		#Following puppets left behind run at 1.35x that to catch up, which keeps pace with a sprint.
		# Default: 0.42
		# Range: 0.01 ~ 2.0
		movementSpeed = 0.42
		#Damage of a puppet's punch (and of a possessed puppet's).
		# Default: 1.0
		# Range: 0.0 ~ 100.0
		meleeDamage = 1.0
		#The most puppets one player can have at once, counting ones in unloaded chunks. At the cap, Puppet Creation
		#fizzles for free; a puppet that dies, dissolves or detonates frees its slot. Lowering this never removes puppets:
		#a player over the new cap keeps theirs but can't make more until below it.
		# Default: 15
		# Range: 1 ~ 10000
		maxPuppets = 15
		#Following puppets walk back to their owner once they are this far away (blocks).
		# Default: 3.0
		# Range: 1.0 ~ 32.0
		followDistance = 3.0
		#Following puppets left this far behind (blocks) catch up at once, like tamed pets.
		# Default: 24.0
		# Range: 4.0 ~ 128.0
		followTeleportDistance = 24.0
		#A puppet standing still spins ("kuru kuru") after this long. Possessed puppets never spin.
