			# Default: 4.0
			# Range: 1.0 ~ 1024.0
			health = 4.0

		[puppet_manipulation.puppet_creation.full]
			# Default: 180.0
			# Range: 0.0 ~ 100000.0
			cost = 180.0
			# Default: 8.0
			# Range: 1.0 ~ 1024.0
			health = 8.0

	#Special of Puppet Creation: move your consciousness into a puppet (the one you look at, else your nearest).
	#You become it; your body stays behind as a defenceless shell. R again returns.
	[puppet_manipulation.possess]
		# Default: 60.0
		# Range: 0.0 ~ 100000.0
		cost = 60.0
		#How far away (blocks) the puppet can be.
		# Default: 32.0
		# Range: 1.0 ~ 256.0
